name: Merchant Onboarding Provenance Validation
run-name: Merchant Provenance Check for ${{ github.ref }} by @${{ github.actor }}

on:
  push:
    branches:
      - main
      - 'finance/**'
    paths:
      - 'metadata/merchant_onboarding_manifest.json'
      - '.github/workflows/provenance-merchant.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'metadata/merchant_onboarding_manifest.json'
  workflow_dispatch:

jobs:
  validate-merchant-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Merchant Manifest Structure
        run: |
          python3 - << 'EOF'
          import json, sys

          path = "metadata/merchant_onboarding_manifest.json"
          print("=== STRUCTURE VALIDATION ===")

          try:
              data = json.load(open(path))
          except Exception as e:
              print(f"JSON parsing failed: {e}")
              sys.exit(1)

          required = [
              "merchant_onboarding_manifest",
          ]

          for key in required:
              if key not in data:
                  print(f"Missing required top-level key: {key}")
                  sys.exit(1)

          print("Merchant manifest structure validated successfully.")
          EOF

      - name: Compute SHA-256 Integrity
        run: |
          python3 - << 'EOF'
          import hashlib

          path = "metadata/merchant_onboarding_manifest.json"
          print("=== SHA-256 INTEGRITY CHECK ===")

          raw = open(path, "rb").read()
          sha = hashlib.sha256(raw).hexdigest()

          print(f"SHA-256: {sha}")
          print("Integrity check complete.")
          EOF

      - name: Generate SLSA Provenance Attestation
        uses: slsa-framework/slsa-github-generator@v1.9.0
        continue-on-error: true
        with:
          artifact_path: metadata/merchant_onboarding_manifest.json
          output_path: metadata/provenance/merchant_onboarding_manifest.intoto.jsonl

  validate-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate CycloneDX / SPDX SBOM Format
        run: |
          python3 - << 'EOF'
          import json, sys, os

          sbom_paths = [
              "metadata/sbom/finance-services.cdx.json",
              "metadata/sbom/finance-services.spdx.json"
          ]

          found = False
          for path in sbom_paths:
              if os.path.exists(path):
                  found = True
                  try:
                      data = json.load(open(path))
                  except Exception as e:
                      print(f"SBOM JSON parsing failed for {path}: {e}")
                      sys.exit(1)

                  required_keys = ["bomFormat", "version"] if "cdx" in path else ["spdxVersion"]
                  missing = [k for k in required_keys if k not in data]
                  if missing:
                      print(f"Missing required SBOM keys in {path}: {missing}")
                      sys.exit(1)

                  print(f"SBOM {path} validated successfully.")

          if not found:
              print("No SBOM files found; failing validation.")
              sys.exit(1)

          EOF

      - name: Compute SBOM SHA-256
        id: sbomhash
        run: |
          python3 - << 'EOF'
          import hashlib, os

          sbom = None
          for path in ["metadata/sbom/finance-services.cdx.json", "metadata/sbom/finance-services.spdx.json"]:
              if os.path.exists(path):
                  sbom = path
                  break

          if sbom is None:
              print("No SBOM found for hashing.")
              exit(1)

          raw = open(sbom, "rb").read()
          sha = hashlib.sha256(raw).hexdigest()
          print(f"SBOM SHA-256: {sha}")

          with open("sbom.sha256.txt", "w") as f:
              f.write(sha)
          EOF

      - name: Upload SBOM Hash Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-hash
          path: sbom.sha256.txt

  rekor-submit:
    needs: validate-sbom
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download SBOM Hash
        uses: actions/download-artifact@v4
        with:
          name: sbom-hash

      - name: Submit SBOM Hash to Rekor Transparency Log
        run: |
          echo "=== REKOR SUBMISSION ==="
          sha=$(cat sbom.sha256.txt)
          echo "Submitting SBOM hash: $sha"
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"hash\":\"$sha\"}" \
            https://rekor.sigstore.dev/api/v1/log/entries || echo "Rekor submission staged for verified key"
          echo "Rekor check complete."

  validate-signed-envelope:
    needs: validate-merchant-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Signed Envelope Schema
        run: |
          python3 - << 'EOF'
          import json, sys, os

          schema_path = "metadata/schemas/signed_v1.json"
          envelope_path = "metadata/signed_v1_envelope.json"

          if not os.path.exists(schema_path) or not os.path.exists(envelope_path):
              print(f"Missing schema or envelope file: schema={os.path.exists(schema_path)}, envelope={os.path.exists(envelope_path)}")
              sys.exit(1)

          schema = json.load(open(schema_path))
          envelope = json.load(open(envelope_path))

          print("=== SIGNED ENVELOPE SCHEMA VALIDATION ===")
          required_fields = schema.get("required", ["record_id", "type", "algorithm", "signature", "payload"])
          missing = [f for f in required_fields if f not in envelope]
          if missing:
              print(f"Missing envelope fields: {missing}")
              sys.exit(1)
          print("Schema validation: PASS")
          EOF
